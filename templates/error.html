{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 style="font-size:6rem;color:#065f46">{{ code }}</h1>
    <h3>{{ message }}</h3>
    <p class="text-muted">Maaf, terjadi kesalahan. Silakan hubungi administrator jika masalah berlanjut.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-3"><i class="bi bi-house"></i> Kembali ke Dashboard</a>
</div>
{% endblock %}
