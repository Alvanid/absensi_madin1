{% extends "base.html" %}
{% block title %}Profil{% endblock %}
{% block page_title %}Profil Saya{% endblock %}

{% block content %}
<div class="row g-3">
    <div class="col-lg-4">
        <div class="card-custom">
            <div class="card-custom-body text-center">
                {% if user.foto %}
                <img src="{{ url_for('static', filename='uploads/' + user.foto) }}" class="avatar-lg mb-3">
                {% else %}
                <div class="avatar-lg bg-light d-flex align-items-center justify-content-center mb-3 mx-auto">
                    <i class="bi bi-person" style="font-size:3rem"></i>
                </div>
                {% endif %}
                <h5>{{ user.nama_lengkap }}</h5>
                <p class="text-muted">@{{ user.username }}</p>
                <span class="badge bg-primary">{{ user.role|upper }}</span>
            </div>
        </div>
    </div>
    <div class="col-lg-8">
        <div class="card-custom mb-3">
            <div class="card-custom-header"><h5><i class="bi bi-person"></i> Informasi Profil</h5></div>
            <div class="card-custom-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" value="{{ user.username }}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" name="nama_lengkap" class="form-control" value="{{ user.nama_lengkap }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ user.email or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nomor HP</label>
                            <input type="text" name="nomor_hp" class="form-control" value="{{ user.nomor_hp or '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Foto Profil</label>
                            <input type="file" name="foto" class="form-control" accept="image/*">
                        </div>
                    </div>
                    <button class="btn btn-primary mt-3"><i class="bi bi-save"></i> Simpan</button>
                </form>
            </div>
        </div>
        
        <div class="card-custom">
            <div class="card-custom-header"><h5><i class="bi bi-lock"></i> Ubah Password</h5></div>
            <div class="card-custom-body">
                <form method="POST" action="{{ url_for('change_password') }}">
                    <div class="mb-3">
                        <label class="form-label">Password Lama</label>
                        <input type="password" name="old_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password Baru</label>
                        <input type="password" name="new_password" class="form-control" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Konfirmasi Password</label>
                        <input type="password" name="confirm_password" class="form-control" minlength="6" required>
                    </div>
                    <button class="btn btn-warning"><i class="bi bi-key"></i> Ubah Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
